services:
  backend:
    build: ./backend
    restart: always
    env_file: ./backend/.env
    volumes:
      - habit_data:/app/data
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    networks:
      - habit-network

  frontend:
    build: ./frontend
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 256M
    networks:
      - habit-network

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ~/conf/nginx:/etc/nginx/conf.d:ro
    depends_on:
      - backend
      - frontend
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 128M
    networks:
      - habit-network

  backup:
    image: alpine:latest
    restart: always
    env_file: ./backend/.env
    environment:
      - TZ=America/Bogota
      - DB_TYPE=sqlite
      - DB_FILE=/app/data/habits.db
      - BACKUP_DIR=/backups
    volumes:
      - habit_data:/app/data:ro
      - ./backend/scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - ./backups:/backups
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 64M
    networks:
      - habit-network
    entrypoint: >
      /bin/sh -c "
      apk add --no-cache sqlite bash tzdata &&
      echo '0 4 * * * /usr/local/bin/backup.sh >> /var/log/backup.log 2>&1' > /etc/periodic/daily/backup_job &&
      chmod +x /etc/periodic/daily/backup_job &&
      crontab /etc/periodic/daily/backup_job &&
      echo 'Backup service started. Cron schedule: 4 AM (America/Bogota)' &&
      crond -f -l 2
      "

volumes:
  habit_data:

networks:
  habit-network:
    driver: bridge